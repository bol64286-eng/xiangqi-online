<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>楚河汉界 · 私人联机象棋</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#112823,#254438);color:#f8e8c5;font-family:system-ui,'Microsoft YaHei',sans-serif;text-align:center;min-height:100vh}h1{margin:18px 0 5px}p{margin:8px}.toolbar{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:14px auto;max-width:700px}button,input{border:0;border-radius:9px;padding:11px 14px;font-size:15px}button{background:#e2b768;color:#2b2012;cursor:pointer;font-weight:650}button:disabled{opacity:.4;cursor:not-allowed}input{max-width:185px;text-transform:uppercase}#board{display:block;margin:12px auto 18px;width:min(96vw,540px);height:auto;touch-action:manipulation;background:#e5b977;border:7px solid #81522d;border-radius:8px}#status{min-height:30px;font-weight:700;padding:4px}#notice{min-height:24px;color:#ffd38a}.note{font-size:13px;color:#dbcaa9}#invite{font-size:14px;overflow-wrap:anywhere;padding:0 15px}#actions{display:none}.panel{max-width:660px;margin:10px auto;padding:8px}#decision{display:none;background:#f2d59d;color:#302219;border-radius:12px;padding:12px;margin:12px auto;max-width:400px}#decision button{margin:4px;background:#385b4d;color:white}</style></head><body><h1>楚河 · 汉界</h1><p>中国象棋 · 私人双人联机</p><div class="toolbar"><button id="create">创建私人房间</button><input id="room" placeholder="输入房间号" maxlength="10"><button id="join">加入房间</button></div><div id="invite"></div><div class="toolbar" id="actions"><button id="share">复制邀请链接</button><button id="undo">申请悔棋</button><button id="reset">申请重新开局</button></div><div id="status">创建房间后，把邀请链接发给朋友</div><div id="notice"></div><div id="decision"><span id="question"></span><div><button id="accept">同意</button><button id="reject">拒绝</button></div></div><canvas id="board" width="540" height="600"></canvas><p class="note">红方先走 · 点击棋子再点击落点 · 刷新后自动恢复座位 · 房间仅限知道链接的人加入</p><script src="/socket.io/socket.io.js"></script><script>
const socket=io(),canvas=document.getElementById('board'),ctx=canvas.getContext('2d'),room=document.getElementById('room'),status=document.getElementById('status'),notice=document.getElementById('notice');let board=[],side='watch',turn='r',winner=null,selected=null,players={},occupied={},pending=null,historyCount=0,code='';const names={rk:'帅',ra:'仕',re:'相',rh:'马',rr:'车',rc:'炮',rp:'兵',bk:'将',ba:'士',be:'象',bh:'马',br:'车',bc:'炮',bp:'卒'};const X=x=>38+x*58,Y=y=>38+y*58;const myToken=c=>sessionStorage.getItem('xiangqi:'+c)||localStorage.getItem('xiangqi:'+c);
function draw(){ctx.clearRect(0,0,540,600);ctx.fillStyle='#e5b977';ctx.fillRect(0,0,540,600);ctx.strokeStyle='#714620';ctx.lineWidth=1.4;for(let y=0;y<10;y++){ctx.beginPath();ctx.moveTo(X(0),Y(y));ctx.lineTo(X(8),Y(y));ctx.stroke()}for(let x=0;x<9;x++){ctx.beginPath();ctx.moveTo(X(x),Y(0));ctx.lineTo(X(x),Y(4));ctx.moveTo(X(x),Y(5));ctx.lineTo(X(x),Y(9));ctx.stroke()}for(let x of [0,8]){ctx.beginPath();ctx.moveTo(X(x),Y(0));ctx.lineTo(X(x),Y(9));ctx.stroke()}for(let y of [0,7]){ctx.beginPath();ctx.moveTo(X(3),Y(y));ctx.lineTo(X(5),Y(y+2));ctx.moveTo(X(5),Y(y));ctx.lineTo(X(3),Y(y+2));ctx.stroke()}ctx.fillStyle='#78502a';ctx.font='30px serif';ctx.textAlign='center';ctx.fillText('楚 河',155,304);ctx.fillText('汉 界',385,304);for(let y=0;y<10;y++)for(let x=0;x<9;x++){let p=board[y]?.[x];if(!p)continue;ctx.beginPath();ctx.arc(X(x),Y(y),24,0,Math.PI*2);ctx.fillStyle=selected?.[0]===y&&selected?.[1]===x?'#ffe69a':'#f5ddb0';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=p[0]==='r'?'#b52f25':'#30322c';ctx.stroke();ctx.fillStyle=p[0]==='r'?'#b52f25':'#252e2c';ctx.font='bold 31px serif';ctx.fillText(names[p],X(x),Y(y)+10)}}
function update(){document.getElementById('actions').style.display=code?'flex':'none';document.getElementById('invite').textContent=code?'房间号：'+code+' · 仅分享给你邀请的人':'';status.textContent=!socket.connected?'网络断开，正在重连…':!code?'创建房间后开始对弈':winner?(winner==='r'?'红方':'黑方')+'获胜！':`你是${side==='r'?'红方':side==='b'?'黑方':'观战者'} · ${turn==='r'?'红方':'黑方'}走棋 · ${players.red?'红方在线':occupied.red?'红方离线':'等待红方'} / ${players.black?'黑方在线':occupied.black?'黑方离线':'等待黑方'}`;document.getElementById('decision').style.display=pending&&pending.by!==side&&side!=='watch'?'block':'none';document.getElementById('question').textContent=pending?`对方请求${pending.type==='undo'?'悔棋':'重新开局'}，是否同意？`:'';document.getElementById('undo').disabled=side==='watch'||!historyCount||!!pending||!players.red||!players.black;document.getElementById('reset').disabled=side==='watch'||!!pending||!players.red||!players.black;draw()}
function enter(res){if(res.error){notice.textContent=res.error;return}code=res.code;side=res.side;room.value=code;selected=null;if(res.token)localStorage.setItem('xiangqi:'+code,res.token);history.replaceState({},'',`?room=${encodeURIComponent(code)}`);notice.textContent=side==='watch'?'房间已满，你现在是观战者':'加入成功，可以邀请朋友了';update()}
function joinRoom(c){c=c.trim().toUpperCase();if(!c)return notice.textContent='请输入房间号';socket.emit('join',{code:c,token:myToken(c)},enter)}
document.getElementById('create').onclick=()=>socket.emit('create',enter);document.getElementById('join').onclick=()=>joinRoom(room.value);document.getElementById('share').onclick=async()=>{if(!code)return;let url=location.origin+'/?room='+encodeURIComponent(code);try{await navigator.clipboard.writeText(url);notice.textContent='邀请链接已复制，发给朋友即可'}catch{prompt('请复制邀请链接',url)}};for(let type of ['undo','reset'])document.getElementById(type).onclick=()=>socket.emit('request',type,r=>{notice.textContent=r.error||'已发送请求，等待对方同意'});for(let [id,accept] of [['accept',true],['reject',false]])document.getElementById(id).onclick=()=>socket.emit('respond',accept,r=>{notice.textContent=r.error|| (accept?'已同意':'已拒绝')});socket.on('state',s=>{board=s.board;turn=s.turn;winner=s.winner;players=s.players;occupied=s.occupied;pending=s.pending;historyCount=s.history;selected=null;update()});socket.on('notice',m=>{notice.textContent=m;side='watch';update()});socket.on('disconnect',update);socket.on('connect',()=>{let c=new URLSearchParams(location.search).get('room')||code;if(c)joinRoom(c);else update()});canvas.onclick=e=>{if(side!==turn||winner||!players.red||!players.black)return;let r=canvas.getBoundingClientRect(),x=Math.round(((e.clientX-r.left)*540/r.width-38)/58),y=Math.round(((e.clientY-r.top)*600/r.height-38)/58);if(x<0||x>8||y<0||y>9)return;if(board[y]?.[x]?.[0]===side){selected=[y,x];draw()}else if(selected){socket.emit('move',{from:selected,to:[y,x]},r=>{if(r?.error)notice.textContent=r.error});selected=null;draw()}};room.value=new URLSearchParams(location.search).get('room')||'';draw();
</script></body></html>
